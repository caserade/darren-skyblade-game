# Publishes updates for the Windows app.
# On every push to main (Claude's version, the main game):
# 1. If desktop-app/package.json has a version with no release yet, builds the Windows app and publishes it
#    as the release app-v<version> (the app tells the player a new app is out).
# 2. Rebuilds the public game-updates branch (one commit, replaced each time) with latest.json and game/.
# On every push to chatgpt (ChatGPT's version): rebuilds the chatgpt-updates branch the same way.
# The app checks both branches and downloads only the files that changed. The repository must be public.
name: Publish game update

on:
  push:
    branches: [main, chatgpt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-game-update-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release the app if its version is new
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./desktop-app/package.json').version")
          if gh release view "app-v$VERSION" >/dev/null 2>&1; then
            echo "app-v$VERSION is already released"
            exit 0
          fi
          cd desktop-app
          npm ci --no-audit --no-fund
          npm run build:win
          gh release create "app-v$VERSION" out/Darren-Skyblade-Windows.zip \
            --title "Darren: Skyblade Hunt for Windows $VERSION" \
            --notes "Download Darren-Skyblade-Windows.zip below, extract it to a new folder and run Darren Skyblade.exe. Your saves carry over. Windows may warn the first time because the app is unsigned: click More info, then Run anyway."
      - name: Build the game update
        run: |
          CHANNEL=$([ "$GITHUB_REF_NAME" = "chatgpt" ] && echo chatgpt || echo claude)
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          node tools/publish-game-update.cjs "$RUNNER_TEMP/update" "$CHANNEL"
      - name: Replace the update branch
        working-directory: ${{ runner.temp }}/update
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$([ "$CHANNEL" = "chatgpt" ] && echo chatgpt-updates || echo game-updates)
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "$CHANNEL game update from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
